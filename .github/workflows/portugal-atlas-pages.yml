name: Publish Terra & Mar demo

on:
  push:
    branches: [codex/portugal-travel-atlas]
    paths:
      - "portugal-atlas/**"
      - ".github/workflows/portugal-atlas-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portugal-atlas-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portugal-atlas
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portugal-atlas/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /lexcia
      - uses: actions/upload-pages-artifact@v4
        with:
          path: portugal-atlas/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
