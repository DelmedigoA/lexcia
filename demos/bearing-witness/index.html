<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Bearing Witness · Research interface</title><link rel="stylesheet" href="src/style.css"><script type="module" src="/src/app.js"></script></head>
<body>
<iframe id="homepage" class="homepage-frame" src="/mirror/index.html" title="Bearing Witness homepage"></iframe>
<button id="launcher" class="launcher" aria-expanded="false" aria-controls="research-panel" aria-haspopup="dialog" aria-label="Explore the archive"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5M8 12h8M12 8v8"/></svg><span class="trigger-label">Explore the archive</span></button>
<dialog id="research-panel" aria-labelledby="panel-title">
<div class="panel-header"><h2 id="panel-title" tabindex="-1">Archive</h2><div class="tools"><button id="threads-toggle" class="icon-btn" aria-label="Show earlier conversations" title="Conversations" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7M18 15v6m-3-3h6"/></svg></button><button id="new" class="icon-btn" aria-label="New inquiry" title="New inquiry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button id="pin" class="icon-btn" aria-label="Pin assistant beside the page" title="Pin beside the page" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 8M14 3l7 7-3 1-3 3-1 3-7-7M11 16l-6 5"/></svg></button><button id="expand" class="icon-btn" aria-label="Expand panel" title="Expand panel" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button><button id="close" class="icon-btn" aria-label="Close research panel" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div></div>
<div id="assistant-divider" class="assistant-divider" role="separator" aria-label="Resize pinned archive assistant" aria-orientation="vertical" aria-valuemin="360" aria-valuemax="720" aria-valuenow="420" tabindex="0" hidden></div>
<button id="resize-grip" class="resize-grip" type="button" aria-label="Resize assistant window. Double-click to restore default size." title="Drag to resize · double-click to reset"></button>
<section id="thread-list" class="thread-list" aria-label="Earlier conversations" hidden></section>
<div id="thread" class="thread"><div id="history-note" class="history-note" hidden><span>Saved conversation · read only</span><button id="continue-new" type="button">Start a new inquiry</button></div><section id="welcome"><h3>Ask the archive.</h3></section><div id="messages" role="log" aria-label="Inquiry messages" aria-live="polite"></div></div>
<div class="composer-area"><form id="composer"><label class="sr-only" for="prompt">Your research question</label><textarea id="prompt" placeholder="Ask about the archive…" rows="2" maxlength="4000" dir="auto"></textarea><div class="composer-bottom"><span id="status" role="status" aria-live="polite"></span><button id="stop" type="button" aria-label="Stop response" hidden>Stop</button><button id="send" type="submit" aria-label="Submit inquiry" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form><p class="assistant-credit">powered by <a href="https://lexcia.vercel.app/" target="_blank" rel="noopener noreferrer">Lexcia</a></p></div>
</dialog>
</body></html>
